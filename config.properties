# ╔════════════════════════════════════════════════════════════════════════════════╝
# ║          Web Performance Automation - Configuration              ║
# ║  Update values below before running tests                        ║
# ╚═════════════════════════════════════════════════════════════════════════════╝

# ─── Application URLs ─────────────────────────────────────────────────────────
# Base URL of your web application (no trailing slash)
app.base.url=http://vishal.mdx.perforce.com:3000

# Login page URL (defaults to base.url/login if not set)
app.login.url=http://vishal.mdx.perforce.com:3000/#/security/signin

# ─── Credentials ──────────────────────────────────────────────────────────────
# Use test/QA credentials only — never production admin accounts
app.username=admin
app.password=admin

# ─── Additional Screens to Measure ────────────────────────────────────────────
# Comma-separated list of screen names and their full URLs
# These screens are navigated to after login, in order
app.screens.names=Login,IP catalog
app.screens.urls=http://vishal.mdx.perforce.com:3000/#/security/signin,http://vishal.mdx.perforce.com:3000/#/ip/catalog

# ─── Browser Configuration ────────────────────────────────────────────────────
# Only "chrome" is supported (required for Chrome DevTools Protocol)
browser=chrome

# Set to true to run without browser UI (useful for CI/CD pipelines)
browser.headless=false

# ─── Timeouts (seconds) ───────────────────────────────────────────────────────
timeout.pageload=30
timeout.implicit=10

# ─── Performance Benchmark Settings ───────────────────────────────────────────
# Number of times to repeat each test for averaging (used in multi-run benchmark)
performance.runs=3

# ─── Report Output ────────────────────────────────────────────────────────────
# Folder where HTML and Excel reports will be saved
report.output.path=reports
# Folder where page screenshots are saved (relative to project root or absolute path)
report.screenshot.path=reports/screenshots
